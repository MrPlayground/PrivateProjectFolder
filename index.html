<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Minimal Chat App</title>
</head>
<body>    

  <main>
    <section id="view-signin" class="auth-view" aria-labelledby="signin-heading">
    <header id="app-header">
    <h1 position:center>Mini Chat App</h1>
      <h2 id="signin-heading">Sign In</h2>
      <form id="signin-form">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" name="email" autocomplete="email" required>
        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" name="password" autocomplete="current-password" required>
        <button type="submit" id="sign-in-button">Sign In</button>
        <p>Don't have an account? <a href="#view-signup" id="show-signup-link">Sign up</a></p>
      </form>
      <div id="auth-error-message" class="auth-error-message" role="alert" aria-live="polite"></div>
    </section>

    <section id="view-signup" class="auth-view" aria-labelledby="signup-heading">
      <h2 id="signup-heading">Create Account</h2>
      <form id="signup-form">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" name="email" autocomplete="email" required>
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" autocomplete="new-password" minlength="6" required>
        <button type="submit" id="create-account-button">Sign Up</button>
        <p>Already have an account? <a href="#view-signin" id="show-signin-link">Sign in</a></p>
      </form>
      <div id="auth-error-message-signup" class="auth-error-message" role="alert" aria-live="polite"></div>
    </section>

    <section id="view-chat" class="chat-view" aria-labelledby="chat-heading">
      <aside id="online-users" aria-labelledby="online-users-heading">
        <h2 id="online-users-heading">Online Users</h2>
        <button type="button" id="logout-button">Log Out</button>
        <ul id="user-list"></ul>
      </aside>
      <div id="chat-box">
        <h2 id="chat-heading">Chat</h2>
        <div id="messages" aria-live="polite" aria-label="Message history"></div>
        <form id="message-form">
          <label for="message-input">Message</label>
          <textarea id="message-input" name="message" rows="3" placeholder="Write a message..." required></textarea>
          <button type="submit" id="send-button">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="auth.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
