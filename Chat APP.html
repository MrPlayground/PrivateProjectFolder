<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimal Chat App</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0e1621; color: #fff; margin: 0; display: flex; height: 100vh; }
    #sidebar { width: 250px; background: #17212b; border-right: 1px solid #0e1621; padding: 15px; }
    #chat-area { flex: 1; display: flex; flex-direction: column; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { background: #182533; padding: 10px; borderRadius: 8px; max-width: 60%; width: fit-content; }
    .message .sender { font-weight: bold; color: #64b5f6; font-size: 0.85em; }
    .message .time { font-size: 0.7em; color: #7f91a4; float: right; margin-left: 10px; margin-top: 4px; }
    #input-area { display: flex; padding: 10px; background: #17212b; }
    #message-input { flex: 1; padding: 10px; border: none; background: #242f3d; color: #fff; border-radius: 4px; }
    button { padding: 10px 20px; border: none; background: #2b5278; color: #fff; margin-left: 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Online Users</h3>
    <ul id="user-list"></ul>
  </div>

  <div id="chat-area">
    <div id="messages"></div>
    <form id="input-area" onsubmit="sendMessage(event)">
      <input type="text" id="message-input" placeholder="Write a message..." required autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const username = prompt("Enter your name:") || "Anonymous";

    socket.emit('user_connected', username);

    socket.on('active_users', (users) => {
      const list = document.getElementById('user-list');
      list.innerHTML = users.map(u => `<li>${u}</li>`).join('');
    });

    socket.on('receive_message', (data) => {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      msgDiv.innerHTML = `
        <div class="sender">${data.sender}</div>
        <div>${data.text} <span class="time">${data.time}</span></div>
      `;
      document.getElementById('messages').appendChild(msgDiv);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      socket.emit('send_message', { text: input.value });
      input.value = '';
    }
  </script>
</body>
</html>
